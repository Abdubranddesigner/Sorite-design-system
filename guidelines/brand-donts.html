<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-body);color:var(--ink)}</style></head><body><div style="background:var(--violet-700);border-radius:10px;padding:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px"><div style="background:#fff;border-radius:6px;height:120px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center"><img src="../assets/logo/soreti-logo-primary.svg" style="width:110px;filter:hue-rotate(40deg) saturate(1.6)"><svg style="position:absolute;inset:0" width="100%" height="100%" preserveAspectRatio="none" viewBox="0 0 100 100"><line x1="0" y1="100" x2="100" y2="0" stroke="#b78f2e" stroke-width="0.6" vector-effect="non-scaling-stroke"/></svg><span style="position:absolute;bottom:6px;left:8px;font-size:10px;color:var(--ink-3)">Recolour</span></div><div style="background:#fff;border-radius:6px;height:120px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center"><img src="../assets/logo/soreti-logo-primary.svg" style="width:110px;transform:scaleX(1.35)"><svg style="position:absolute;inset:0" width="100%" height="100%" preserveAspectRatio="none" viewBox="0 0 100 100"><line x1="0" y1="100" x2="100" y2="0" stroke="#b78f2e" stroke-width="0.6" vector-effect="non-scaling-stroke"/></svg><span style="position:absolute;bottom:6px;left:8px;font-size:10px;color:var(--ink-3)">Stretch</span></div><div style="background:#fff;border-radius:6px;height:120px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center"><img src="../assets/logo/soreti-logo-primary.svg" style="width:110px;filter:drop-shadow(3px 3px 2px rgba(0,0,0,.5))"><svg style="position:absolute;inset:0" width="100%" height="100%" preserveAspectRatio="none" viewBox="0 0 100 100"><line x1="0" y1="100" x2="100" y2="0" stroke="#b78f2e" stroke-width="0.6" vector-effect="non-scaling-stroke"/></svg><span style="position:absolute;bottom:6px;left:8px;font-size:10px;color:var(--ink-3)">Shadow</span></div><div style="background:#fff;border-radius:6px;height:120px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center"><img src="../assets/logo/soreti-logo-primary.svg" style="width:110px;filter:blur(2px)"><svg style="position:absolute;inset:0" width="100%" height="100%" preserveAspectRatio="none" viewBox="0 0 100 100"><line x1="0" y1="100" x2="100" y2="0" stroke="#b78f2e" stroke-width="0.6" vector-effect="non-scaling-stroke"/></svg><span style="position:absolute;bottom:6px;left:8px;font-size:10px;color:var(--ink-3)">Blur</span></div></div></body></html>
